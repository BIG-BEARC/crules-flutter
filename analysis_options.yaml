# crules-flutter 模板 · 静态分析基线（安装时复制到项目根；项目已有自己的则保留项目的）
# 定位：把可确定性判定的规则从散文变 analyzer 硬拦（外审⑧「规则工具化」首期）
# 依赖：flutter_lints（须在 pubspec dev_dependencies——缺依赖时 analyzer 会**静默跳过** include，基线不生效；flutter create 脚手架默认已带）
# 维护：flutter_lints 大版本升级时复查规则集变化（include 是滚动集合，升版可能新增/移除规则——与 skill 坑节维护义务同批例行）
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # 对应 checklist「组件/视图」类——归口与硬编码
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_fields
    - unnecessary_late
    - avoid_print                    # 统一日志工具（checklist §6）
    - avoid_unnecessary_containers
    - prefer_single_quotes
    # 对应 checklist「边界处理」类——异步纪律（CancelToken 纪律无对应 lint 规则：
    # cancelled_token_use 系 analyzer 诊断名而非 lint 规则，曾列此为死配置已删——落点 checklist 异步纪律节，custom_lint 二期候选）
    - unawaited_futures
    - always_declare_return_types
    # 公开面纪律（plugin/库场景加重）；public_member_api_docs 按项目自开（flutter_lints 未启用它，
    # map 形态 disable 条目曾扰动列表解析致报警行号偏移，已删——0.4.1 A1）
    - type_annotate_public_apis
    - prefer_typing_uninitialized_variables

# 说明：
# - 「禁 inline 颜色字面量 / 禁传 ref 参数 / import 五段分组」等语义规则 analyzer 原生不覆盖，
#   属 custom_lint 范畴（外审⑦ 大杠杆项，二期：颜色字面量 / ConsumerWidget ref 传参 / import 分组均可写成 custom_lint 规则）
# - strict-* 三开关会暴露存量代码告警——新项目直接用；存量项目可先注释 strict 段渐进收紧
# - custom_lint/riverpod_lint 通电采纳注记（质量闸通电批 1b · 2026-11-18，方案 docs/方案-质量闸通电-2026-11-18.md）：
#   装了两包而本档无 plugins 段＝装而未通电（插件规则零生效）。采纳＝把下面两行拷进上面 analyzer: 段——
#     plugins:
#       - custom_lint
#   前置条件（同 flutter_lints 静默跳过纪律）：pubspec dev_dependencies 须已装 custom_lint，缺依赖 analyzer 静默跳过。
#   版本矩阵（U7 真机实测 2026-11-18，flutter 3.27.4/Dart 3.6.2）：custom_lint 0.7.3＋riverpod_lint 2.6.4 可通；
#   老版 0.6.x 不可编译（analyzer 7 API 断档）；analyzer_plugin 须 dependency_overrides 钉 0.13.4
#   （custom_lint 插件宿主临时仓自行 pub get，经工程 pubspec_overrides.yaml 通道钉版——本档注释不代钉）。
#   通电后收尾告警比对走插件 cache `scripts/analyze-baseline.py`（首跑 --init-baseline 冻结存量、只拦新增）。
#   已采纳建议稿的存量工程（.crules-state ao_adopted）收此注记＝建议非变更，更新按需手工（存量同步通道裁决）。
